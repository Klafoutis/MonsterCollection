vich_uploader:
    db_driver: orm

    mappings:
        monster_images:
            uri_prefix: /uploads/monsters
            upload_destination: '%kernel.project_dir%/public/uploads/monsters'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        user_avatars:
            uri_prefix: /uploads/avatars
            upload_destination: '%kernel.project_dir%/public/uploads/avatars'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
